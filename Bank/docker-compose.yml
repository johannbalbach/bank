services:
  BankUserDb:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
        POSTGRES_DB: BankUserDb
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 200220042010
    volumes:
      - bankuserdb_data:/var/lib/postgresql/data
    networks:
      - usernetwork

  BankCreditDb:
    image: postgres:13
    ports:
      - "5433:5432"
    environment:
        POSTGRES_DB: BankCreditDb
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 200220042010
    volumes:
    - bankcreditdb_data:/var/lib/postgresql/data
    networks:
      - usernetwork

  core_db:
    image: postgres:13
    ports:
      - "5434:5432"
    environment:
        POSTGRES_DB: core_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 1
    volumes:
    - bankcoredb_data:/var/lib/postgresql/data
    networks:
      - usernetwork

  BankAuthDb:
    image: postgres:13
    ports:
        - "5435:5432"
    environment:
        POSTGRES_DB: BankAuthDb
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 200220042010
    volumes:
    - bankauthdb_data:/var/lib/postgresql/data
    networks:
     - usernetwork

  storage_bank_db:
    image: postgres:13
    ports:
      - "5436:5432"
    environment:
        POSTGRES_DB: storage_bank_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 1
    volumes:
    - bankstoragedb_data:/var/lib/postgresql/data
    networks:
      - usernetwork
 
  core:
    image: ${DOCKER_REGISTRY-}core
    build:
      context: .
      dockerfile: Core/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - usernetwork

  creditservice:
    image: ${DOCKER_REGISTRY-}creditservice
    build:
      context: .
      dockerfile: CreditService/Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - usernetwork

  userservice:
    image: ${DOCKER_REGISTRY-}userservice
    build:
      context: .
      dockerfile: UserService/Dockerfile
    ports:
      - "5003:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - usernetwork


  identityserver:
    image: ${DOCKER_REGISTRY-}identityserver
    build:
      context: .
      dockerfile: IndentityServer/Dockerfile
    ports:
      - "5004:8080"
    volumes:
      - /path/to/keys:/app/keys
    user: root
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - usernetwork


  storageservice:
    image: ${DOCKER_REGISTRY-}storageservice
    build:
      context: .
      dockerfile: StorageService/Dockerfile
    ports:
      - "5005:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - usernetwork


  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - usernetwork
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      retries: 5
      start_period: 10s

  

networks:
   usernetwork:

volumes:
   bankuserdb_data:
   bankcreditdb_data:
   bankcoredb_data:
   bankauthdb_data:
   bankstoragedb_data:

